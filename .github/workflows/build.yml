name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          brew install python-tk@3.12
          pip install bilibili-api-python aiohttp certifi matplotlib pyinstaller

      - name: Build
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --name "BiliLiveMonitor" \
            --icon "icon.icns" \
            --add-data "live_monitor_core.py:." \
            --add-data "live_monitor_notify.py:." \
            --collect-submodules "bilibili_api" \
            --collect-all "certifi" \
            --hidden-import "aiohttp" \
            --hidden-import "yarl" \
            --hidden-import "multidict" \
            --clean \
            --noconfirm \
            live_monitor_gui.py

      - name: Package as ZIP
        run: |
          cd dist
          zip -r BiliLiveMonitor-mac.zip BiliLiveMonitor.app

      - uses: actions/upload-artifact@v4
        with:
          name: BiliLiveMonitor-mac
          path: dist/BiliLiveMonitor-mac.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install bilibili-api-python aiohttp certifi matplotlib pyinstaller

      - name: Build
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "BiliLiveMonitor" `
            --icon "icon.ico" `
            --add-data "live_monitor_core.py;." `
            --add-data "live_monitor_notify.py;." `
            --collect-submodules "bilibili_api" `
            --collect-all "certifi" `
            --hidden-import "aiohttp" `
            --hidden-import "yarl" `
            --hidden-import "multidict" `
            --clean `
            --noconfirm `
            live_monitor_gui.py

      - uses: actions/upload-artifact@v4
        with:
          name: BiliLiveMonitor-windows
          path: dist/BiliLiveMonitor.exe

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: BiliLiveMonitor-*
          path: dist

      - name: Display artifacts
        run: ls -R dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BiliLiveMonitor-mac/BiliLiveMonitor-mac.zip
            dist/BiliLiveMonitor-windows/BiliLiveMonitor.exe
          generate_release_notes: true
